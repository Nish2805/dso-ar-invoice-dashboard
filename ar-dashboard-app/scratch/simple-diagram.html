<title>How It Works</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one big diagram, nothing else — plain-language boxes, two flows
     (request path on top, publish path below), generous size for clarity. */
  :root{
    --bg:#f6f7f4; --card:#ffffff; --border:#dcdfd8;
    --text:#14181a; --text-soft:#4c5457; --muted:#868d8a;
    --blue:#2a78d6; --violet:#4a3aa7; --teal:#12707a; --neutral:#6b716d;
    --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f0e; --card:#161c19; --border:#2a322d;
      --text:#f2f3f0; --text-soft:#b7bab2; --muted:#7d8179;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0f0e; --card:#161c19; --border:#2a322d;
    --text:#f2f3f0; --text-soft:#b7bab2; --muted:#7d8179;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
       padding-left:max(16px,env(safe-area-inset-left,0px));
       padding-right:max(16px,env(safe-area-inset-right,0px));
       padding-block:32px;}
  .wrap{max-width:1180px;margin:0 auto;}
  h1{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.6vw,28px);
     margin:0 0 20px;text-align:center;letter-spacing:-.01em;}
  .fig{margin:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;}
  .fig svg{display:block;width:100%;height:auto;color:var(--text-soft);}
  .fig figcaption{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px;}
  .d-box{fill:var(--bg);stroke:var(--border);stroke-width:1.3;}
  .d-title{font-family:var(--font-display);font-weight:600;font-size:16px;fill:var(--text);}
  .d-sub{font-family:var(--font-body);font-size:11.5px;fill:var(--text-soft);}
  .d-badge-txt{font-family:var(--font-display);font-weight:700;font-size:11px;fill:#fff;}
  .d-arrow{stroke:var(--text-soft);stroke-width:1.6;fill:none;}
  .d-arrow-label{font-family:var(--font-body);font-size:11.5px;fill:var(--text-soft);}
  .d-arrowhead{fill:var(--text-soft);}
  .d-eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;fill:var(--muted);}
  .d-step-num{font-family:var(--font-display);font-weight:700;font-size:20px;fill:var(--muted);}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<div class="wrap">
  <h1>How the Dashboard Works</h1>
  <figure class="fig">
    <svg viewBox="0 0 1160 540" role="img"
         aria-label="You open the dashboard in your browser. The dashboard asks the calculator a question, the calculator looks up the real data and sends back the answer, and the dashboard shows it to you. Below, a second flow shows how updates go live: someone writes the update, it gets checked, it gets published, and then everyone sees it live.">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <polygon points="0,0 10,5 0,10" class="d-arrowhead" />
        </marker>
      </defs>

      <!-- Row label -->
      <text x="30" y="30" class="d-eyebrow">WHEN YOU OPEN THE DASHBOARD</text>

      <!-- Box 1: You -->
      <rect x="30" y="160" width="190" height="160" rx="14" class="d-box" />
      <circle cx="125" cy="200" r="28" fill="var(--neutral)" />
      <text x="125" y="205" text-anchor="middle" class="d-badge-txt">YOU</text>
      <text x="125" y="258" text-anchor="middle" class="d-title">You</text>
      <text x="125" y="278" text-anchor="middle" class="d-sub">open it in your browser</text>

      <!-- Box 2: Dashboard -->
      <rect x="280" y="140" width="230" height="200" rx="14" class="d-box" />
      <circle cx="395" cy="182" r="30" fill="var(--blue)" />
      <text x="395" y="187" text-anchor="middle" class="d-badge-txt">APP</text>
      <text x="395" y="248" text-anchor="middle" class="d-title">The Dashboard</text>
      <text x="395" y="268" text-anchor="middle" class="d-sub">the page you see</text>
      <text x="395" y="284" text-anchor="middle" class="d-sub">and click around in</text>

      <!-- Box 3: Calculator -->
      <rect x="570" y="140" width="230" height="200" rx="14" class="d-box" />
      <circle cx="685" cy="182" r="30" fill="var(--violet)" />
      <text x="685" y="190" text-anchor="middle" class="d-badge-txt" style="font-size:18px">&#8721;</text>
      <text x="685" y="248" text-anchor="middle" class="d-title">The Calculator</text>
      <text x="685" y="268" text-anchor="middle" class="d-sub">fetches and adds up</text>
      <text x="685" y="284" text-anchor="middle" class="d-sub">the real numbers</text>

      <!-- Box 4: Data -->
      <rect x="860" y="110" width="270" height="260" rx="14" class="d-box" />
      <circle cx="995" cy="160" r="30" fill="var(--teal)" />
      <text x="995" y="165" text-anchor="middle" class="d-badge-txt">DATA</text>
      <text x="995" y="226" text-anchor="middle" class="d-title">Your Real Data</text>
      <text x="995" y="248" text-anchor="middle" class="d-sub">1.3 million actual</text>
      <text x="995" y="264" text-anchor="middle" class="d-sub">invoice records</text>
      <text x="995" y="290" text-anchor="middle" class="d-sub">no copies, no samples</text>

      <!-- Arrows: row 1 -->
      <line x1="220" y1="230" x2="278" y2="230" class="d-arrow" marker-end="url(#ah)" />
      <text x="249" y="218" text-anchor="middle" class="d-arrow-label">opens</text>

      <line x1="510" y1="196" x2="568" y2="196" class="d-arrow" marker-end="url(#ah)" />
      <text x="539" y="184" text-anchor="middle" class="d-arrow-label">asks a question</text>
      <line x1="568" y1="256" x2="510" y2="256" class="d-arrow" marker-end="url(#ah)" />
      <text x="539" y="276" text-anchor="middle" class="d-arrow-label">sends back the answer</text>

      <line x1="800" y1="176" x2="858" y2="176" class="d-arrow" marker-end="url(#ah)" />
      <text x="829" y="164" text-anchor="middle" class="d-arrow-label">looks it up</text>
      <line x1="858" y1="246" x2="800" y2="246" class="d-arrow" marker-end="url(#ah)" />
      <text x="829" y="266" text-anchor="middle" class="d-arrow-label">real numbers back</text>

      <!-- Second flow -->
      <text x="30" y="400" class="d-eyebrow">WHEN SOMEONE UPDATES THE DASHBOARD</text>

      <rect x="30" y="420" width="250" height="90" rx="12" class="d-box" />
      <text x="54" y="458" class="d-step-num">1</text>
      <text x="54" y="482" class="d-title" style="font-size:13.5px">Write the update</text>

      <rect x="330" y="420" width="250" height="90" rx="12" class="d-box" />
      <text x="354" y="458" class="d-step-num">2</text>
      <text x="354" y="482" class="d-title" style="font-size:13.5px">Check it works</text>

      <rect x="630" y="420" width="250" height="90" rx="12" class="d-box" />
      <text x="654" y="458" class="d-step-num">3</text>
      <text x="654" y="482" class="d-title" style="font-size:13.5px">Publish it</text>

      <rect x="930" y="420" width="200" height="90" rx="12" class="d-box" />
      <text x="954" y="458" class="d-step-num">4</text>
      <text x="954" y="482" class="d-title" style="font-size:13.5px">Live for everyone</text>

      <line x1="280" y1="465" x2="328" y2="465" class="d-arrow" marker-end="url(#ah)" />
      <line x1="580" y1="465" x2="628" y2="465" class="d-arrow" marker-end="url(#ah)" />
      <line x1="880" y1="465" x2="928" y2="465" class="d-arrow" marker-end="url(#ah)" />
    </svg>
    <figcaption>Every number on the dashboard is fetched and calculated live — nothing is stored ahead of time.</figcaption>
  </figure>
</div>
