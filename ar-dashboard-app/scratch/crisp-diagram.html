<title>AR Dashboard Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: title + one dense, icon-led system diagram, nothing else.
     Zones left-to-right/top-to-bottom mirror a standard cloud-architecture
     diagram: external identity, users, the Fabric workspace (security / app
     / data rows), and the release path along the bottom. */
  :root{
    --bg:#f6f7f4; --card:#ffffff; --border:#dcdfd8;
    --text:#14181a; --text-soft:#4c5457; --muted:#868d8a;
    --blue:#2a78d6; --violet:#4a3aa7; --teal:#12707a; --neutral:#6b716d;
    --sec:#c23b36; --rel:#d98a2b; --ok:#0f8a5c;
    --blue-soft:rgba(42,120,214,.08); --violet-soft:rgba(74,58,167,.08);
    --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0f0e; --card:#161c19; --border:#2a322d;
      --text:#f2f3f0; --text-soft:#b7bab2; --muted:#7d8179;
      --blue-soft:rgba(90,160,240,.12); --violet-soft:rgba(140,120,220,.12);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0f0e; --card:#161c19; --border:#2a322d;
    --text:#f2f3f0; --text-soft:#b7bab2; --muted:#7d8179;
    --blue-soft:rgba(90,160,240,.12); --violet-soft:rgba(140,120,220,.12);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
       padding-left:max(16px,env(safe-area-inset-left,0px));
       padding-right:max(16px,env(safe-area-inset-right,0px));
       padding-block:32px;}
  .wrap{max-width:1280px;margin:0 auto;}
  h1{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3.4vw,27px);
     margin:0 0 20px;text-align:center;letter-spacing:-.01em;}
  .fig{margin:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .fig svg{display:block;width:100%;height:auto;color:var(--text-soft);}
  .fig figcaption{text-align:center;font-size:12.5px;color:var(--muted);margin-top:12px;}

  .dg-boundary{fill:none;stroke:var(--border);stroke-width:1.5;stroke-dasharray:6 5;}
  .dg-tile{fill:var(--bg);stroke:var(--border);stroke-width:1.2;}
  .dg-tile-blue{fill:var(--blue-soft);stroke:var(--blue);}
  .dg-tile-violet{fill:var(--violet-soft);stroke:var(--violet);}
  .dg-chip{fill:var(--card);stroke:var(--border);stroke-width:1;}
  .dg-eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;fill:var(--teal);}
  .dg-row-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;fill:var(--muted);}
  .dg-title{font-family:var(--font-display);font-weight:600;font-size:12.5px;fill:var(--text);}
  .dg-sub{font-family:var(--font-body);font-size:10px;fill:var(--text-soft);}
  .dg-chip-title{font-family:var(--font-mono);font-size:9px;fill:var(--text);}
  .dg-chip-sub{font-family:var(--font-body);font-size:8px;fill:var(--muted);}
  .dg-note{font-family:var(--font-body);font-size:9.5px;fill:var(--muted);}
  .dg-arrow{stroke:var(--text-soft);stroke-width:1.4;fill:none;}
  .dg-arrow-label{font-family:var(--font-mono);font-size:9.5px;fill:var(--text-soft);}
  .dg-arrowhead{fill:var(--text-soft);}

  .legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:12px;
          font-size:11px;color:var(--text-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<div class="wrap">
  <h1>AR Invoice Dashboard — Architecture</h1>
  <figure class="fig">
    <svg viewBox="0 0 1300 660" role="img"
         aria-label="Browser signs in via Entra ID and calls the Fabric App over HTTPS. The Fabric App queries Rayfin Functions via invoke() and the Lakehouse Connector via GraphQL, inside the DIEZ Under Development Fabric workspace. Rayfin Functions run parameterized SQL against the LH_DIEZ_CRM Lakehouse's five tables, using a SQL token issued to the App Identity; the Connector runs capped dropdown-only lookups against the same Lakehouse. Below, a release path shows a local machine building the code and deploying both the Fabric App and Rayfin Functions together with one npx rayfin up command, gated to the item's actual owner.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <polygon points="0,0 10,5 0,10" class="dg-arrowhead" />
        </marker>

        <symbol id="ic-lock" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </symbol>
        <symbol id="ic-key" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="4"/>
          <line x1="11" y1="11" x2="21" y2="21"/>
          <line x1="16" y1="16" x2="19" y2="13"/>
        </symbol>
        <symbol id="ic-atom" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6">
          <circle cx="12" cy="12" r="1.8" fill="#fff"/>
          <ellipse cx="12" cy="12" rx="10" ry="4"/>
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/>
          <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>
        </symbol>
        <symbol id="ic-browser" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <line x1="2" y1="9" x2="22" y2="9"/>
        </symbol>
        <symbol id="ic-link" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <rect x="2" y="8" width="11" height="8" rx="4"/>
          <rect x="11" y="8" width="11" height="8" rx="4"/>
        </symbol>
        <symbol id="ic-bolt" viewBox="0 0 24 24" fill="#fff">
          <polygon points="13,2 4,14 11,14 9,22 20,9 13,9"/>
        </symbol>
        <symbol id="ic-db" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="8" ry="3"/>
          <path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/>
          <path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
        </symbol>
        <symbol id="ic-pc" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="1.5"/>
          <line x1="8" y1="20" x2="16" y2="20"/>
          <line x1="12" y1="16" x2="12" y2="20"/>
        </symbol>
        <symbol id="ic-term" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="6,9 10,12 6,15"/>
          <line x1="12" y1="15" x2="17" y2="15"/>
        </symbol>
        <symbol id="ic-rocket" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="21" x2="12" y2="5"/>
          <polygon points="12,2 6,10 18,10" fill="#fff" stroke="none"/>
        </symbol>
        <symbol id="ic-check" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4,13 9,18 20,6"/>
        </symbol>
      </defs>

      <!-- External identity -->
      <text x="20" y="30" class="dg-eyebrow">EXTERNAL IDENTITY</text>
      <rect x="20" y="40" width="200" height="86" rx="10" class="dg-boundary" />
      <rect x="36" y="56" width="168" height="56" rx="8" class="dg-tile" />
      <rect x="48" y="66" width="24" height="24" rx="6" fill="var(--blue)" />
      <use href="#ic-lock" x="51" y="69" width="18" height="18" />
      <text x="80" y="80" class="dg-title">Entra ID</text>
      <text x="80" y="94" class="dg-sub">sign-in + SQL token</text>

      <!-- Users -->
      <text x="20" y="158" class="dg-eyebrow">USERS</text>
      <rect x="20" y="168" width="200" height="60" rx="8" class="dg-tile" />
      <rect x="32" y="178" width="24" height="24" rx="6" fill="var(--neutral)" />
      <use href="#ic-browser" x="35" y="181" width="18" height="18" />
      <text x="64" y="190" class="dg-title">Browser</text>
      <text x="64" y="204" class="dg-sub">React app</text>

      <!-- Main Fabric workspace boundary -->
      <rect x="260" y="20" width="1020" height="410" rx="14" class="dg-boundary" />
      <text x="280" y="40" class="dg-eyebrow">MICROSOFT FABRIC · WORKSPACE: DIEZ — UNDER DEVELOPMENT</text>

      <!-- Security row -->
      <text x="300" y="54" class="dg-row-label">SECURITY</text>
      <rect x="300" y="60" width="240" height="56" rx="8" class="dg-tile" />
      <rect x="312" y="70" width="24" height="24" rx="6" fill="var(--sec)" />
      <use href="#ic-key" x="315" y="73" width="18" height="18" />
      <text x="344" y="82" class="dg-title">App Identity</text>
      <text x="344" y="96" class="dg-sub">Fabric App's owner account</text>

      <!-- App layer row -->
      <text x="300" y="142" class="dg-row-label">APPLICATION LAYER</text>

      <rect x="300" y="148" width="200" height="86" rx="10" class="dg-tile-blue" />
      <rect x="312" y="158" width="24" height="24" rx="6" fill="var(--blue)" />
      <use href="#ic-atom" x="315" y="161" width="18" height="18" />
      <text x="344" y="172" class="dg-title">Fabric App</text>
      <text x="344" y="186" class="dg-sub">React · Rayfin framework</text>

      <rect x="520" y="148" width="200" height="86" rx="10" class="dg-tile" />
      <rect x="532" y="158" width="24" height="24" rx="6" fill="var(--neutral)" />
      <use href="#ic-link" x="535" y="161" width="18" height="18" />
      <text x="564" y="172" class="dg-title">Connector</text>
      <text x="564" y="186" class="dg-sub">GraphQL · dropdown only</text>

      <rect x="740" y="148" width="200" height="86" rx="10" class="dg-tile-violet" />
      <rect x="752" y="158" width="24" height="24" rx="6" fill="var(--violet)" />
      <use href="#ic-bolt" x="755" y="161" width="18" height="18" />
      <text x="784" y="172" class="dg-title">Functions</text>
      <text x="784" y="186" class="dg-sub">TypeScript + SQL</text>

      <rect x="960" y="148" width="200" height="86" rx="10" class="dg-tile" />
      <rect x="972" y="158" width="24" height="24" rx="6" fill="var(--blue)" />
      <use href="#ic-lock" x="975" y="161" width="18" height="18" />
      <text x="1004" y="172" class="dg-title">SSO Session</text>
      <text x="1004" y="186" class="dg-sub">Fabric session</text>

      <!-- Data layer -->
      <text x="300" y="296" class="dg-row-label">DATA LAYER</text>
      <rect x="300" y="302" width="920" height="170" rx="12" class="dg-tile" />
      <text x="316" y="326" class="dg-title">LH_DIEZ_CRM — Lakehouse</text>
      <text x="316" y="340" class="dg-sub">SQL analytics endpoint, schema EDW</text>

      <rect x="316" y="352" width="150" height="50" rx="6" class="dg-chip" />
      <rect x="324" y="360" width="18" height="18" rx="4" fill="var(--teal)" />
      <use href="#ic-db" x="327" y="363" width="12" height="12" />
      <text x="350" y="368" class="dg-chip-title">INVOICE_LINE_F</text>
      <text x="350" y="380" class="dg-chip-sub">fact · ~1.3M rows</text>

      <rect x="490" y="352" width="150" height="50" rx="6" class="dg-chip" />
      <rect x="498" y="360" width="18" height="18" rx="4" fill="var(--teal)" />
      <use href="#ic-db" x="501" y="363" width="12" height="12" />
      <text x="524" y="368" class="dg-chip-title">CUSTOMER_D</text>
      <text x="524" y="380" class="dg-chip-sub">dimension</text>

      <rect x="664" y="352" width="150" height="50" rx="6" class="dg-chip" />
      <rect x="672" y="360" width="18" height="18" rx="4" fill="var(--teal)" />
      <use href="#ic-db" x="675" y="363" width="12" height="12" />
      <text x="698" y="368" class="dg-chip-title">BUSINESSUNIT_D</text>
      <text x="698" y="380" class="dg-chip-sub">dimension</text>

      <rect x="838" y="352" width="150" height="50" rx="6" class="dg-chip" />
      <rect x="846" y="360" width="18" height="18" rx="4" fill="var(--teal)" />
      <use href="#ic-db" x="849" y="363" width="12" height="12" />
      <text x="872" y="368" class="dg-chip-title">RECORDTYPE_D</text>
      <text x="872" y="380" class="dg-chip-sub">dimension</text>

      <rect x="1012" y="352" width="150" height="50" rx="6" class="dg-chip" />
      <rect x="1020" y="360" width="18" height="18" rx="4" fill="var(--teal)" />
      <use href="#ic-db" x="1023" y="363" width="12" height="12" />
      <text x="1046" y="368" class="dg-chip-title">INVOICE_SOURCE_D</text>
      <text x="1046" y="380" class="dg-chip-sub">dimension</text>

      <text x="760" y="418" text-anchor="middle" class="dg-note">
        joined via OrgID · CustTrxTypeSeqID · BillToCustomerID · BatchSourceSeqID
      </text>
      <text x="760" y="432" text-anchor="middle" class="dg-note">
        same live data Power BI or SSMS would see — nothing cached, nothing pre-aggregated
      </text>

      <!-- Release path -->
      <rect x="20" y="510" width="1260" height="140" rx="14" class="dg-boundary" />
      <text x="42" y="528" class="dg-eyebrow">RELEASE PATH</text>

      <rect x="60" y="542" width="280" height="70" rx="10" class="dg-tile" />
      <rect x="74" y="552" width="24" height="24" rx="6" fill="var(--rel)" />
      <use href="#ic-pc" x="77" y="555" width="18" height="18" />
      <text x="106" y="564" class="dg-title">Local machine</text>
      <text x="106" y="578" class="dg-sub">developer's own terminal</text>

      <rect x="360" y="542" width="280" height="70" rx="10" class="dg-tile" />
      <rect x="374" y="552" width="24" height="24" rx="6" fill="var(--rel)" />
      <use href="#ic-term" x="377" y="555" width="18" height="18" />
      <text x="406" y="564" class="dg-title">Build</text>
      <text x="406" y="578" class="dg-sub">tsc --build · npm build</text>

      <rect x="660" y="542" width="280" height="70" rx="10" class="dg-tile" />
      <rect x="674" y="552" width="24" height="24" rx="6" fill="var(--rel)" />
      <use href="#ic-rocket" x="677" y="555" width="18" height="18" />
      <text x="706" y="564" class="dg-title">Deploy</text>
      <text x="706" y="578" class="dg-sub">npx rayfin up</text>

      <rect x="960" y="542" width="280" height="70" rx="10" class="dg-tile" />
      <rect x="974" y="552" width="24" height="24" rx="6" fill="var(--ok)" />
      <use href="#ic-check" x="977" y="555" width="18" height="18" />
      <text x="1006" y="564" class="dg-title">Live</text>
      <text x="1006" y="578" class="dg-sub">App + Functions, together</text>

      <text x="660" y="636" text-anchor="middle" class="dg-note">
        deploying functions that touch the Lakehouse requires signing in as the Fabric item's actual owner — anyone else is blocked
      </text>

      <!-- Arrows -->
      <line x1="204" y1="84" x2="298" y2="191" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="248" y="146" text-anchor="middle" class="dg-arrow-label">sign-in</text>

      <line x1="204" y1="84" x2="298" y2="88" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="248" y="76" text-anchor="middle" class="dg-arrow-label">app identity</text>

      <polyline points="420,116 420,126 840,126 840,148" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="630" y="120" text-anchor="middle" class="dg-arrow-label">SQL token</text>

      <line x1="220" y1="198" x2="298" y2="191" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="255" y="186" text-anchor="middle" class="dg-arrow-label">HTTPS</text>

      <line x1="500" y1="191" x2="518" y2="191" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="509" y="180" text-anchor="middle" class="dg-arrow-label">GraphQL</text>

      <polyline points="400,234 400,254 800,254 800,234" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="600" y="248" text-anchor="middle" class="dg-arrow-label">invoke()</text>

      <line x1="880" y1="234" x2="880" y2="300" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="886" y="264" class="dg-arrow-label">parameterized SQL</text>

      <line x1="620" y1="234" x2="620" y2="300" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="626" y="264" class="dg-arrow-label">dropdown lookups</text>

      <polyline points="800,542 800,522 240,522 240,190 298,190" class="dg-arrow" marker-end="url(#arrow)" />
      <text x="250" y="350" text-anchor="start" class="dg-arrow-label" transform="rotate(-90 250 350)">build + deploy both together</text>
    </svg>
    <figcaption>
      Browser signs in via Entra ID and talks to the Fabric App; the App calls
      Rayfin Functions (SQL) and the Connector (GraphQL), both reading the same
      Lakehouse. One command, run by the item's owner, deploys the App and
      Functions together.
    </figcaption>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>Identity / auth</span>
      <span><i style="background:var(--violet)"></i>Functions (SQL)</span>
      <span><i style="background:var(--neutral)"></i>Connector (GraphQL)</span>
      <span><i style="background:var(--teal)"></i>Lakehouse data</span>
      <span><i style="background:var(--rel)"></i>Release path</span>
    </div>
  </figure>
</div>
